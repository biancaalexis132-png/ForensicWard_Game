name: Godot headless validation
on:
  push:
    branches: [main, codex/sprint-01-tests]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install checksum-verified Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base=https://github.com/godotengine/godot/releases/download/4.7-stable
          curl --fail --location --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          curl --fail --location --retry 3 -o Godot_v4.7-stable_linux.x86_64.zip "$base/Godot_v4.7-stable_linux.x86_64.zip"
          grep ' Godot_v4.7-stable_linux.x86_64.zip$' SHA512-SUMS.txt > selected.sha512
          sha512sum --check selected.sha512
          unzip Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import, validate content, run scenarios and smoke tests
        run: python3 tests/qa/run.py
